- name: keep-emiljs
  tags:
    formats: [emiljs]
  schema: boolean
  default: false
  description:
    short: "Keep the intermediate emil.js Markdown file."
    long: |
      Keep the intermediate Markdown file (`<stem>-emiljs.md`) that Pandoc
      writes and emil.js then builds into the final HTML.
      Use `output-ext: md` to stop after Pandoc and deliver only that file.

- name: theme
  tags:
    formats: [emiljs]
  schema:
    anyOf:
      - string
      - arrayOf: string
  description:
    short: "The emil.js theme: a bundled name or a local `.css` file, or a list of them (last wins)."

- name: aspect
  tags:
    formats: [emiljs]
  schema: number
  description:
    short: "Canvas aspect ratio of the slides (width / height)."

- name: dir
  tags:
    formats: [emiljs]
  schema:
    enum: [ltr, rtl]
  description:
    short: "Base text direction of the deck."

- name: writing-mode
  tags:
    formats: [emiljs]
  schema:
    enum: [horizontal-tb, vertical-rl, vertical-lr]
  description:
    short: "Base CSS writing mode of the deck."

- name: autoplay
  tags:
    formats: [emiljs]
  schema:
    anyOf:
      - boolean
      - number
  description:
    short: "Auto-advance the slides: `true`, or a number of seconds per slide."

- name: style
  tags:
    formats: [emiljs]
  schema: object
  description:
    short: "Document-wide emil.js style tokens."

- name: fonts
  tags:
    formats: [emiljs]
  schema:
    arrayOf: object
  description:
    short: "Self-hosted `.woff2` font families for the deck."

- name: defaults
  tags:
    formats: [emiljs]
  schema: object
  description:
    short: "Per-slide options applied to every slide unless a slide overrides them."

- name: vocabulary
  tags:
    formats: [emiljs]
  schema: boolean
  default: true
  description:
    short: "Include emil.js's bundled class vocabulary (location grid, image-fit helpers)."

- name: footer
  tags:
    formats: [emiljs]
  schema: string
  description:
    short: "Footer text on every slide (shorthand for `defaults: footer:`)."

- name: logo
  tags:
    formats: [emiljs]
  schema: string
  description:
    short: "Logo image on every slide (shorthand for `defaults: logo:`)."

- name: slide-number
  tags:
    formats: [emiljs]
  schema: boolean
  description:
    short: "Show slide numbers (shorthand for `defaults: slide-number:`)."

- name: shiki
  tags:
    formats: [emiljs]
  schema: boolean
  default: false
  description:
    short: "Highlight code blocks with Shiki."
    long: |
      Highlight fenced code blocks with Shiki, the same highlighter
      `emiljs build` uses, so code looks the same in both. The build carries
      a fixed set of languages (bash, css, diff, html, javascript, json,
      markdown, python, r, sql, toml, typescript, xml, yaml); another
      language renders as a plain block, with a warning.

- name: shiki-style
  tags:
    formats: [emiljs]
  schema:
    enum: [github-light, github-dark]
  default: github-light
  description:
    short: "The Shiki color theme for code blocks."

- name: shiki-langs
  tags:
    formats: [emiljs]
  schema:
    arrayOf:
      anyOf:
        - string
        - object:
            closed: true
            required: [path]
            properties:
              path: string
              name: string
              aliases:
                arrayOf: string
  description:
    short: "Extra Shiki languages, as TextMate grammar JSON files."
    long: |
      Extra languages for Shiki code highlighting, as TextMate grammar JSON
      files (the shape VS Code extensions and the `tm-grammars` package ship),
      by path relative to the document. A string is the path; an object adds
      the language `name` and `aliases` the code blocks use. Needs
      `shiki: true`.

- name: shiki-aliases
  tags:
    formats: [emiljs]
  schema:
    object:
      additionalProperties: string
  description:
    short: "Code block languages that highlight as another language."
    long: |
      Code block language names that highlight as another language, for
      example `rscript: r`. The target must be a language the build carries or
      one from `shiki-langs`. Needs `shiki: true`.
